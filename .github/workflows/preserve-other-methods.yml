name: Preserve Other Methods

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/other-methods/**'

permissions:
  contents: write

jobs:
  preserve:
    # Do not run for the workflow's own preservation commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Preserve previous C++ solutions
        shell: bash
        run: |
          set -euo pipefail

          echo "Commit: $GITHUB_SHA"
          echo "Message: $(git log -1 --pretty=%s)"

          # Get files changed by THIS push, including modifications and renames.
          mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r --diff-filter=AMR HEAD -- '*.cpp')

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No added/modified/renamed C++ solution files. Nothing to preserve."
            exit 0
          fi

          preserved=false

          for file in "${changed_files[@]}"; do
            [ -z "$file" ] && continue

            # Skip anything inside other-methods.
            case "$file" in
              */other-methods/*) continue ;;
            esac

            # A file is eligible only if it existed in the parent commit.
            if ! git cat-file -e "HEAD^:$file" 2>/dev/null; then
              echo "New solution: $file — nothing to archive."
              continue
            fi

            directory=$(dirname "$file")
            methods_dir="$directory/other-methods"
            mkdir -p "$methods_dir"

            # Find the next free method number.
            next_number=1
            while [ -e "$methods_dir/method-$next_number.cpp" ]; do
              next_number=$((next_number + 1))
            done

            # IMPORTANT: archive the solution BEFORE this LeetHub update.
            git show "HEAD^:$file" > "$methods_dir/method-$next_number.cpp"

            echo "Archived: $file -> $methods_dir/method-$next_number.cpp"
            preserved=true
          done

          if [ "$preserved" = true ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            git add -- '**/other-methods/*.cpp'

            if git diff --cached --quiet; then
              echo "Nothing new to commit."
              exit 0
            fi

            git commit -m 'Preserve previous LeetCode methods'
            git push
          else
            echo "No previous solutions needed preservation."
          fi